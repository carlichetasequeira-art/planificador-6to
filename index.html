<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nica Planes 2026 - Generador Inteligente para Docentes</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #0d9488;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --accent: #b91c1c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
        }

        h2 {
            color: var(--primary);
            text-align: center;
            margin-top: 0;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #334155;
        }

        select, input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fff;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.2);
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1e40af;
        }

        .plan-output {
            background: white;
            padding: 40px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-top: 20px;
            line-height: 1.6;
        }

        .action-btns {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-secondary {
            background-color: var(--secondary);
        }
        .btn-secondary:hover {
            background-color: #0f766e;
        }

        #contador-creditos {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            color: #92400e;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }

        @media print {
            body { padding: 0; background: white; }
            .card-controls, .action-btns, header { display: none !important; }
            .card { box-shadow: none; padding: 0; border: none; }
            .plan-output { border: none; padding: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <header style="margin-bottom: 20px; text-align: center;">
        <h2>🇳🇮 Nica Planes 2026</h2>
        <p style="color: #64748b; margin: 0;">Generador Inteligente de Planes Diarios para Docentes</p>
    </header>

    <div class="card card-controls">
        <div id="contador-creditos">⚡ Cargando estado de créditos...</div>

        <div class="input-group" style="background: #eff6ff; padding: 12px; border-radius: 8px; border: 1px dashed #3b82f6;">
            <label style="color: #1d4ed8;">🔑 Tu API Key de Gemini:</label>
            <input type="password" id="apiKey" placeholder="Pega aquí tu clave de API de Gemini">
            <small style="color: #64748b;">(Se almacena de forma segura solo en tu navegador).</small>
        </div>

        <div class="grid-2">
            <div class="input-group">
                <label>Grado:</label>
                <select id="grado">
                    <option value="3er Grado">3.º Grado</option>
                    <option value="4to Grado">4.º Grado</option>
                    <option value="5to Grado">5.º Grado</option>
                    <option value="6to Grado" selected>6.º Grado</option>
                </select>
            </div>

            <div class="input-group">
                <label>Asignatura:</label>
                <select id="asignatura">
                    <option value="Lengua y Literatura">Lengua y Literatura</option>
                    <option value="Matemáticas">Matemáticas</option>
                    <option value="Ciencias Naturales">Ciencias Naturales</option>
                    <option value="Ciencias Sociales">Ciencias Sociales</option>
                    <option value="Derecho y Dignidad de la Mujer">Derecho y Dignidad de la Mujer</option>
                    <option value="Aprender Emprender y Prosperar">Aprender Emprender y Prosperar</option>
                    <option value="Taller de Arte y Cultura">Taller de Arte y Cultura</option>
                    <option value="Creciendo en Valores">Creciendo en Valores</option>
                    <option value="Educación Física">Educación Física</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label>Nombre y número de Unidad:</label>
            <input type="text" id="unidad" value="Unidad III: Ciudadanía, Historia y Desarrollo Comunitario">
        </div>

        <div class="input-group">
            <label>Tema o Contenido Específico:</label>
            <input type="text" id="contenido" placeholder="Ej. El Cuento Nicaragüense, Cálculo de Áreas, Ecosistemas...">
        </div>

        <div class="input-group">
            <label>Indicador de Logro:</label>
            <textarea id="indicador">Aplica con precisión los conceptos y procedimientos estudiados en situaciones prácticas del entorno escolar y comunitario.</textarea>
        </div>

        <div class="grid-2">
            <div class="input-group">
                <label>Fecha:</label>
                <input type="date" id="fecha">
            </div>
            <div class="input-group">
                <label>Instrumento de Evaluación:</label>
                <select id="instrumento">
                    <option value="Lista de cotejo">Lista de cotejo</option>
                    <option value="Rúbrica">Rúbrica</option>
                    <option value="Escala de valoración">Escala de valoración</option>
                </select>
            </div>
        </div>

        <button onclick="verificarCreditosYGenerar()">🚀 Generar Plan de Clase Enriquecido con IA</button>
    </div>

    <!-- RESULTADO -->
    <div class="card" id="result-card" style="display: none;">
        <h3 style="color: var(--primary); border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-top:0;">📄 Plan Diario Oficial</h3>
        <div id="plan-container" class="plan-output"></div>

        <div class="action-btns" id="action-buttons-div">
            <button class="btn-secondary" onclick="copiarTexto()">📋 Copiar al Portapapeles</button>
            <button onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
        </div>
    </div>
</div>

<script>
    document.getElementById('fecha').valueAsDate = new Date();

    // Actualizar estado del contador al cargar la página
    function actualizarContadorVisual() {
        const esPro = localStorage.getItem("nica_planes_pro") === "activo";
        if (esPro) {
            document.getElementById("contador-creditos").innerText = "⭐ Cuenta Pro Activa (Generación Ilimitada)";
            document.getElementById("contador-creditos").style.background = "#d1fae5";
            document.getElementById("contador-creditos").style.borderColor = "#10b981";
            document.getElementById("contador-creditos").style.color = "#065f46";
        } else {
            let creditos = localStorage.getItem("nica_planes_creditos");
            if (creditos === null) creditos = 3;
            document.getElementById("contador-creditos").innerText = `⚡ Te quedan ${creditos} planes de prueba gratuitos.`;
        }
    }

    actualizarContadorVisual();

    function verificarCreditosYGenerar() {
        const esPro = localStorage.getItem("nica_planes_pro") === "activo";

        if (!esPro) {
            let creditos = localStorage.getItem("nica_planes_creditos");
            if (creditos === null) {
                creditos = 3;
            } else {
                creditos = parseInt(creditos);
            }

            if (creditos <= 0) {
                mostrarModalPago();
                return;
            }

            creditos--;
            localStorage.setItem("nica_planes_creditos", creditos);
            actualizarContadorVisual();
        }

        llamarInteligenciaArtificial();
    }

    function mostrarModalPago() {
        document.getElementById('action-buttons-div').style.display = 'none';
        document.getElementById('plan-container').innerHTML = `
            <div style="text-align: center; padding: 20px; background: #fff1f2; border: 2px solid #f43f5e; border-radius: 8px;">
                <h3 style="color: #be123c; margin-top:0;">🛑 ¡Se te acabaron los planes de prueba gratuitos!</h3>
                <p>Para seguir generando planes ilimitados y enriquecidos con inteligencia artificial, activa tu cuenta <strong>Nica Planes Pro</strong>.</p>
                <p style="font-size: 14px; color: #475569;">Escríbele al Profe Carlos para adquirir tu código de acceso.</p>
                
                <div style="margin-top: 15px;">
                    <input type="text" id="codigo-activacion" placeholder="Ingresa tu código Pro aquí" style="max-width: 300px; display: inline-block; margin-right: 10px;">
                    <button onclick="activarCodigoPro()" style="width: auto; padding: 10px 20px; display: inline-block;">Activar Cuenta</button>
                </div>
            </div>
        `;
        document.getElementById('result-card').style.display = 'block';
    }

    function activarCodigoPro() {
        const codigoIngresado = document.getElementById('codigo-activacion').value.trim();
        const codigoSecretoMaster = "NICAPLANES2026PRO"; // Puedes cambiar este código cuando gustes

        if (codigoIngresado === codigoSecretoMaster) {
            localStorage.setItem("nica_planes_pro", "activo");
            alert("¡Código activado con éxito! Ahora tienes acceso ilimitado.");
            location.reload();
        } else {
            alert("❌ Código incorrecto. Verifica con el administrador.");
        }
    }

    async function llamarInteligenciaArtificial() {
        const apiKey = document.getElementById('apiKey').value.trim();
        if (!apiKey) {
            alert("¡Hey carnal! Por favor ingresa tu API Key de Gemini arriba para que el sistema pueda generar la información.");
            return;
        }

        const grado = document.getElementById('grado').value;
        const asignatura = document.getElementById('asignatura').value;
        const unidad = document.getElementById('unidad').value;
        const contenido = document.getElementById('contenido').value || "Tema central";
        const indicador = document.getElementById('indicador').value;
        const fecha = document.getElementById('fecha').value;
        const instrumento = document.getElementById('instrumento').value;

        document.getElementById('action-buttons-div').style.display = 'none';
        document.getElementById('plan-container').innerHTML = "<p style='text-align:center;'>⏳ Analizando currículo y redactando plan enriquecido con IA... Por favor espera.</p>";
        document.getElementById('result-card').style.display = 'block';

        const promptMaestro = `
        Actúa como un experto asesor pedagógico del Ministerio de Educación de Nicaragua. 
        Genera un plan de clase diario completo, sumamente enriquecido, profundo y detallado (nada de textos vacíos) para la asignatura de ${asignatura}, dirigido a estudiantes de ${grado}.
        
        Datos base del plan:
        - Unidad: ${unidad}
        - Contenido específico: ${contenido}
        - Indicador de logro: ${indicador}
        - Fecha: ${fecha}
        - Instrumento de evaluación: ${instrumento}

        Instrucciones estrictas para el formato y contenido:
        Usa estrictamente las siguientes etiquetas y secciones oficiales:
        - Plan Diario Asignatura: ${asignatura} | Fecha: ${fecha} | Grado: ${grado}
        - Tiempo: 45 minutos
        - Nombre y número de Unidad: ${unidad}
        - Indicador de logro: ${indicador}
        - Criterios de evaluación (*Conceptual, *Procedimental, *Actitudinal) con detalles sólidos basados en el tema.
        - Actividades de inicio (Bienvenida, activación, contextualización).
        - Actividades de desarrollo (INFORMACIÓN TÉCNICA REAL, lectura modelo con preguntas de comprensión si es Lengua y Literatura, o pasos matemáticos resueltos si es Matemáticas, o marco conceptual completo si es otra materia).
        - Actividades de Culminación (Plenaria, evaluación con ${instrumento}).
        - Tarea práctica.
        - Adecuación curricular para niños con dificultades.
        Devuelve el resultado con etiquetas HTML limpias (como <h4>, <p>, <ul>, <li>, <strong>) para que se vea perfectamente ordenado.
        `;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptMaestro }] }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content) {
                const textoGenerado = data.candidates[0].content.parts[0].text;
                document.getElementById('plan-container').innerHTML = textoGenerado;
                document.getElementById('action-buttons-div').style.display = 'flex';
            } else {
                document.getElementById('plan-container').innerHTML = "<p style='color:red;'>Hubo un error al generar el plan. Revisa que tu API Key sea correcta o tenga saldo activo.</p>";
            }
        } catch (error) {
            console.error(error);
            document.getElementById('plan-container').innerHTML = "<p style='color:red;'>Error de conexión con la API.</p>";
        }
    }

    function copiarTexto() {
        const texto = document.getElementById('plan-container').innerText;
        navigator.clipboard.writeText(texto).then(() => {
            alert("¡Plan copiado al portapapeles con éxito!");
        });
    }
</script>

</body>
</html>
