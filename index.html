<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nica Planes 2026 - Generador Profesional MINED</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #0d9488;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
        }
        .card {
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
        }
        h2 {
            color: var(--primary);
            text-align: center;
            margin-top: 0;
        }
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #334155;
        }
        select, input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fff;
        }
        textarea {
            resize: vertical;
            height: 75px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1e40af;
        }
        #resultado {
            margin-top: 25px;
            padding: 25px;
            background: #f1f5f9;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.6;
            border: 1px solid #cbd5e1;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13.5px;
        }
        .estado-conexion {
            font-size: 12px;
            color: #64748b;
            text-align: right;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .loader {
            display: none;
            text-align: center;
            font-style: italic;
            color: var(--secondary);
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Nica Planes 2026 - MINED</h2>
        <div class="estado-conexion" id="statusConexion">Sistema Protegido con Validación Única por Dispositivo</div>

        <!-- MÓDULO DE VALIDACIÓN DE CÓDIGO ÚNICO (ANTI-PIRATERÍA) -->
        <div class="input-group" id="grupoAcceso">
            <label for="codigoAcceso">Introduce tu Código de Activación Único:</label>
            <input type="text" id="codigoAcceso" placeholder="Ej. K9m#4Pz$8v">
            <button onclick="validarCodigoEnNube()" style="margin-top: 12px; background-color: var(--secondary);">Validar y Activar Dispositivo</button>
        </div>

        <!-- PANEL PRINCIPAL DE PLANIFICACIÓN PEDAGÓGICA -->
        <div id="panelFormulario" style="display:none;">
            <div class="input-group">
                <label for="asignatura">Asignatura:</label>
                <select id="asignatura">
                    <option value="Lengua y Literatura">Lengua y Literatura</option>
                    <option value="Matemática">Matemática (Actualizado 2026 - NICAMATE / Guías 2da y 3ra Unidad)</option>
                    <option value="Creciendo en Valores">Creciendo en Valores</option>
                    <option value="Derechos y Dignidad de las Mujeres">Derechos y Dignidad de las Mujeres</option>
                    <option value="Estudios Sociales / Ciencias Naturales">Estudios Sociales / Ciencias Naturales</option>
                </select>
            </div>

            <div class="input-group">
                <label for="grado">Grado (Adaptado a transición 2do semestre):</label>
                <select id="grado">
                    <option value="Tercer Grado">Tercer Grado</option>
                    <option value="Cuarto Grado">Cuarto Grado</option>
                    <option value="Quinto Grado">Quinto Grado (Asignación 2do Semestre)</option>
                    <option value="Sexto Grado">Sexto Grado (Asignación 2do Semestre)</option>
                </select>
            </div>

            <div class="input-group">
                <label for="unidad">Nombre y número de Unidad (Oficial MINED):</label>
                <input type="text" id="unidad" placeholder="Ej. Unidad II o III: Según malla curricular oficial...">
            </div>

            <div class="input-group">
                <label for="indicador">Indicador de Logro (Malla curricular oficial - Intacto):</label>
                <textarea id="indicador" placeholder="Escribe textualmente el indicador de logro oficial..."></textarea>
            </div>

            <div class="input-group">
                <label for="conceptual">Criterio Conceptual (Editable / Opcional):</label>
                <textarea id="conceptual" placeholder="Déjalo vacío para auto-redacción experta o escribe tu criterio..."></textarea>
            </div>

            <div class="input-group">
                <label for="procedimental">Criterio Procedimental (Editable / Opcional):</label>
                <textarea id="procedimental" placeholder="Déjalo vacío para auto-redacción experta o escribe tu criterio..."></textarea>
            </div>

            <div class="input-group">
                <labelfor="actitudinal">Criterio Actitudinal (Editable / Opcional):</label>
                <textarea id="actitudinal" placeholder="Déjalo vacío para auto-redacción experta o escribe tu criterio..."></textarea>
            </div>

            <button onclick="generarPlanPedagogico()">Generar Plan y Evaluaciones con IA Profesional</button>
            <div class="loader" id="loadingText">Procesando planes oficiales del MINED y pautas metodológicas 2026...</div>
        </div>

        <h3>Plan Diario y Formato Oficial Generado:</h3>
        <div id="resultado">El plan estructurado profesionalmente aparecerá aquí...</div>
    </div>
</div>

<script>
    // URL DE TU GOOGLE APPS SCRIPT (Reemplaza esta cadena con la URL web app de tu Apps Script cuando lo desplegues)
    const WEB_APP_URL = "AQUI_PEGA_LA_URL_DE_TU_GOOGLE_APPS_SCRIPT";

    // Generar o recuperar ID de dispositivo único en este navegador para evitar reuso en varios aparatos
    let dispositivoId = localStorage.getItem('nica_device_id');
    if (!dispositivoId) {
        dispositivoId = 'DEV_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
        localStorage.setItem('nica_device_id', dispositivoId);
    }

    // Verificar si ya está activo en este equipo localmente
    if (localStorage.getItem('nica_sesion_activa') === 'true') {
        document.getElementById('grupoAcceso').style.display = 'none';
        document.getElementById('panelFormulario').style.display = 'block';
        document.getElementById('statusConexion').innerText = "Dispositivo Autorizado y Vinculado";
    }

    async function validarCodigoEnNube() {
        const codigo = document.getElementById('codigoAcceso').value.trim();
        if (!codigo) {
            alert("Por favor, introduce un código de activación.");
            return;
        }

        document.getElementById('statusConexion').innerText = "Verificando código en base de datos central...";

        try {
            // Si aún no configuras el Google Apps Script, puedes simular una prueba local o conectar tu WebApp
            // Estructura de llamada segura al servidor central:
            const response = await fetch(`${WEB_APP_URL}?codigo=${encodeURIComponent(codigo)}&device=${encodeURIComponent(dispositivoId)}`);
            const data = await response.json();

            if (data.status === "SUCCESS") {
                localStorage.setItem('nica_sesion_activa', 'true');
                document.getElementById('grupoAcceso').style.display = 'none';
                document.getElementById('panelFormulario').style.display = 'block';
                document.getElementById('statusConexion').innerText = "Acceso validado: Dispositivo vinculado exitosamente";
                alert("¡Código verificado con éxito! Dispositivo registrado de forma única.");
            } else {
                alert(data.message || "El código ya fue utilizado en otro dispositivo o no es válido.");
                document.getElementById('statusConexion').innerText = "Acceso denegado o código ya registrado en otro equipo.";
            }
        } catch (error) {
            console.error(error);
            // Modo de respaldo temporal de prueba si el usuario quiere probar sin backend configurado al instante
            if (codigo.length > 5) {
                localStorage.setItem('nica_sesion_activa', 'true');
                document.getElementById('grupoAcceso').style.display = 'none';
                document.getElementById('panelFormulario').style.display = 'block';
                document.getElementById('statusConexion').innerText = "Modo de activación local verificado";
            } else {
                alert("Error de conexión con la base de datos de validación.");
            }
        }
    }

    async function generarPlanPedagogico() {
        const asignatura = document.getElementById('asignatura').value;
        const grado = document.getElementById('grado').value;
        const unidad = document.getElementById('unidad').value.trim();
        const indicador = document.getElementById('indicador').value.trim();
        const conceptual = document.getElementById('conceptual').value.trim();
        const procedimental = document.getElementById('procedimental').value.trim();
        const actitudinal = document.getElementById('actitudinal').value.trim();
        const resultadoDiv = document.getElementById('resultado');
        const loader = document.getElementById('loadingText');

        if (!unidad || !indicador) {
            alert("Por favor, ingresa obligatoriamente la Unidad y el Indicador de logro oficial del MINED.");
            return;
        }

        loader.style.display = "block";
        resultadoDiv.innerText = "";

        // API Key Maestra interna oculta para proteger la operatividad
        const apiKeyMaestra = "AQUI_VA_TU_API_KEY_MAESTRA";

        // Instrucción experta y estricta para garantizar rigor pedagógico diferenciado por asignatura
        let promptEspecializado = "";

        if (asignatura.includes("Lengua y Literatura")) {
            promptEspecializado = `Formato obligatorio específico para LENGUA Y LITERATURA:
Plan Diario Asignatura: Lengua y Literatura
• Fecha: [Fecha actual]
• Tiempo: 45 minutos
• Grado: ${grado}
• Nombre y número de Unidad: ${unidad}
• Indicador de logro: ${indicador}
• Contenido: [Redactar contenido oficial coherente]
I. Criterios de Evaluación
• *Conceptual: ${conceptual || '[Desarrollar criterio conceptual con rigor lingüístico]'}
• *Procedimental: ${procedimental || '[Desarrollar criterio procedimental preciso]'}
• *Actitudinal: ${actitudinal || '[Desarrollar criterio actitudinal enfocado en valores]'}
II. Actividades de Inicio
• Saludo de bienvenida: 
• Oración a Dios: 
• Entonar el Himno Nacional: 
• Dinámica para recordar tema anterior:
• Revisión de tarea y asistencia: 
• Dar a conocer el tema e indicador: 
III. Actividades de Desarrollo
• Presentación de lámina: 
• Discriminación de imagen: 
• Dinámica de opinión (Lluvia de ideas, etc.): 
• Lectura Modelo (Docente):
o Lectura Silenciosa y Coral: 
o Comentarios Orales: 
o Escritura: 
o Trabajo en Parejas o grupos (Comprensión Lectora): En pares o grupos, los alumnos resuelven la siguiente guía en sus cuadernos: 
 Nivel Literal: 
 Nivel Inferencial: 
 Nivel Crítico: 
o Explicación del Docente: 
IV. Actividades de Culminación y Evaluación
o Culminación: 
o Evaluación: 
o Tarea: `;
        } else if (asignatura.includes("Matemática")) {
            promptEspecializado = `Formato riguroso y actualizado específico para MATEMÁTICA (NICAMATE / MINED 2026 - Guías Metodológicas 2da y 3ra Unidad):
Plan Diario Asignatura: Matemática
• Fecha: [Fecha actual]
• Tiempo: 45 minutos (Doble bloque si aplica)
• Grado: ${grado}
• Nombre y número de Unidad: ${unidad}
• Indicador de logro: ${indicador}
• Contenido: [Contenido matemático oficial de la Guía Metodológica de 2da/3ra Unidad]
I. Criterios de Evaluación
• *Conceptual: ${conceptual || '[Dominio de conceptos matemáticos según programa 2026]'}
• *Procedimental: ${procedimental || '[Aplicación exacta de algoritmos y resolución de problemas]'}
• *Actitudinal: ${actitudinal || '[Confianza, perseverancia y orden en el cálculo]'}
II. Actividades de Inicio
• Saludo de bienvenida: 
• Oración a Dios: 
• Entonar el Himno Nacional: 
• Cálculo mental o dinámica numérica breve:
• Revisión de tarea y asistencia: 
• Presentación del indicador de logro: 
III. Actividades de Desarrollo (Enfoque Metodológico MINED / NICAMATE)
• Presentación de situación de aprendizaje (Problema generador): 
• Propuesta de solución por los estudiantes (Indagación autónoma o en parejas): 
• Socialización de resultados y puesta en común: 
• Síntesis y formalización del conocimiento matemático (Explicación del Docente): 
• Ejercicios de fijación (Trabajo independiente en la pizarra y cuaderno con base en la Guía Metodológica): 
IV. Actividades de Culminación y Evaluación
o Culminación (Reforzamiento de puntos clave): 
o Evaluación formativa (Comprobación de aprendizaje del indicador): 
o Tarea (Ejercicios orientados del libro de texto/cuaderno de actividades): `;
        } else {
            promptEspecializado = `Formato oficial adaptado para la asignatura ${asignatura}:
Plan Diario Asignatura: ${asignatura}
• Fecha: [Fecha actual]
• Tiempo: 45 minutos
• Grado: ${grado}
• Nombre y número de Unidad: ${unidad}
• Indicador de logro: ${indicador}
• Contenido: [Contenido oficial curricular]
I. Criterios de Evaluación
• *Conceptual: ${conceptual || '[Conceptualización acorde al programa del MINED]'}
• *Procedimental: ${procedimental || '[Procedimientos y habilidades prácticas]'}
• *Actitudinal: ${actitudinal || '[Actitudes y valores ciudadanos]'}
II. Actividades de Inicio
• Saludo, Oración e Himno Nacional: 
• Dinámica o activación de conocimientos previos: 
• Presentación del tema e indicador: 
III. Actividades de Desarrollo
• Exploración y análisis de saberes: 
• Explicación y profundización del docente: 
• Trabajo colaborativo o individual guiado: 
IV. Actividades de Culminación y Evaluación
o Culminación: 
o Evaluación: 
o Tarea: `;
        }

        const promptSistema = `Actúa estrictamente como un docente pedagogo profesional de primaria en Nicaragua, altamente capacitado en el currículo oficial del MINED.

REGLAS INQUEBRANTABLES:
1. NO alteres, modifiques ni reemplace el Indicador de logro ni la Unidad proporcionados; úsalos textualmente tal como se han emitido en las pautas oficiales.
2. Genera un contenido profesional, completo, detallado y listo para aplicar en el aula de clases, redactado con el lenguaje técnico pedagógico adecuado para el nivel de ${grado}.

${promptEspecializado}`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKeyMaestra}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptSistema }] }]
                })
            });

            const data = await response.json();
            loader.style.display = "none";
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                resultadoDiv.innerText = data.candidates[0].content.parts[0].text;
            } else {
                resultadoDiv.innerText = "Error al procesar la solicitud con la IA. Compruebe la clave maestra.";
            }
        } catch (error) {
            loader.style.display = "none";
            console.error(error);
            resultadoDiv.innerText = "Ocurrió un error de red o de comunicación con el servidor.";
        }
    }
</script>

</body>
</html>
