<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nica Planes 2026 - Lengua y Literatura</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #34495e; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #27ae60; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 20px; width: 100%; }
        button:hover { background-color: #219653; }
        #resultado { margin-top: 25px; padding: 20px; background: #ecf0f1; border-radius: 5px; white-space: pre-wrap; line-height: 1.5; }
        .creditos { text-align: right; font-size: 14px; color: #7f8c8d; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Nica Planes 2026</h1>
    <div class="creditos" id="contadorCreditos">Créditos disponibles: 5</div>

    <label for="apiKey">Clave de API de Gemini:</label>
    <input type="password" id="apiKey" placeholder="Pega tu API Key de Google AI Studio aquí">

    <label for="grado">Grado:</label>
    <input type="text" id="grado" value="Quinto Grado" placeholder="Ej. Quinto Grado o Sexto Grado">

    <label for="contenido">Indicador de logro y Contenido principal:</label>
    <textarea id="contenido" rows="3" placeholder="Ej. Analizar la estructura del cuento y su comprensión lectora..."></textarea>

    <button onclick="generarPlan()">Generar Plan de Lengua y Literatura con IA</button>

    <h3>Plan Generado:</h3>
    <div id="resultado">El plan generado aparecerá aquí...</div>
</div>

<script>
    let creditos = localStorage.getItem('nica_creditos');
    if (creditos === null) {
        creditos = 5;
        localStorage.setItem('nica_creditos', creditos);
    }
    document.getElementById('contadorCreditos').innerText = `Créditos disponibles: ${creditos}`;

    async function generarPlan() {
        let currentCreditos = parseInt(localStorage.getItem('nica_creditos'));
        if (currentCreditos <= 0) {
            alert("Has agotado tus créditos gratuitos. Introduce un código de activación válido.");
            return;
        }

        const apiKey = document.getElementById('apiKey').value.trim();
        const grado = document.getElementById('grado').value;
        const contenido = document.getElementById('contenido').value.trim();
        const resultadoDiv = document.getElementById('resultado');

        if (!apiKey) {
            alert("Por favor, introduce tu API Key de Gemini.");
            return;
        }
        if (!contenido) {
            alert("Por favor, ingresa el indicador de logro o contenido.");
            return;
        }

        resultadoDiv.innerText = "Generando plan pedagógico con inteligencia artificial...";

        const promptSistema = `Actúa como un asistente docente experto en el Currículo Educativo de Nicaragua para la asignatura de Lengua y Literatura. Rellena la siguiente estructura pedagógica detalladamente basándote en este indicador/contenido: "${contenido}" para el grado "${grado}". No alteres los títulos de la estructura:

Plan Diario Asignatura: Lengua y Literatura
• Fecha: [Fecha actual]
• Tiempo: 45 minutos
• Grado: ${grado}
• Nombre y número de Unidad: 
• Indicador de logro: ${contenido}
• Contenido: 
I. Criterios de Evaluación
• *Conceptual: 
• *Procedimental: 
• *Actitudinal: 
II. Actividades de Inicio
• Saludo de bienvenida: 
• Oración a Dios: 
• Entonar el Himno Nacional: 
• Dinámica para recordar tema anterior:
• Revisión de tarea y asistencia: 
• Dar a conocer el tema e indicador: 
III. Actividades de Desarrollo
• Presentación de lámina: 
• Discriminación de imagen: 
• Dinámica de opinión (Lluvia de ideas,etc..): 
• Lectura Modelo (Docente):
o Lectura Silenciosa y Coral: 
o Comentarios Orales: 
o Escritura: 
o Trabajo en Parejas o grupos (Comprensión Lectora): En pares o grupos, los alumnos resuelven la siguiente guía en sus cuadernos: 
 Nivel Literal: 
 Nivel Inferencial: 
 Nivel Crítico: 
o Explicación del Docente: 
IV. Actividades de Culminación y Evaluación
o Culminación: 
o Evaluación: 
o Tarea: `;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptSistema }] }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const planGenerado = data.candidates[0].content.parts[0].text;
                resultadoDiv.innerText = planGenerado;

                currentCreditos--;
                localStorage.setItem('nica_creditos', currentCreditos);
                document.getElementById('contadorCreditos').innerText = `Créditos disponibles: ${currentCreditos}`;
            } else {
                resultadoDiv.innerText = "Error al generar la respuesta de la IA. Revisa tu API Key.";
            }
        } catch (error) {
            console.error(error);
            resultadoDiv.innerText = "Ocurrió un error de conexión con la API de Gemini.";
        }
    }
</script>

</body>
</html>
