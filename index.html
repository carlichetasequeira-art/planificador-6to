<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nica Planes 2026 - Generador Inteligente para Docentes</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #0d9488;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --accent: #b91c1c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
        }

        h2 {
            color: var(--primary);
            text-align: center;
            margin-top: 0;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #334155;
        }

        select, input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fff;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.2);
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1e40af;
        }

        .plan-output {
            background: white;
            padding: 40px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-top: 20px;
            line-height: 1.6;
        }

        .action-btns {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-secondary {
            background-color: var(--secondary);
        }
        .btn-secondary:hover {
            background-color: #0f766e;
        }

        @media print {
            body { padding: 0; background: white; }
            .card-controls, .action-btns, header { display: none !important; }
            .card { box-shadow: none; padding: 0; border: none; }
            .plan-output { border: none; padding: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <header style="margin-bottom: 20px; text-align: center;">
        <h2>🇳🇮 Nica Planes 2026</h2>
        <p style="color: #64748b; margin: 0;">Generador Oficial de Planes Diarios para Docentes</p>
    </header>

    <div class="card card-controls">
        <div class="grid-2">
            <div class="input-group">
                <label>Grado:</label>
                <select id="grado">
                    <option value="3er Grado">3.º Grado</option>
                    <option value="4to Grado">4.º Grado</option>
                    <option value="5to Grado">5.º Grado</option>
                    <option value="6to Grado" selected>6.º Grado</option>
                </select>
            </div>

            <div class="input-group">
                <label>Asignatura:</label>
                <select id="asignatura">
                    <option value="Lengua y Literatura">Lengua y Literatura</option>
                    <option value="Matemáticas">Matemáticas</option>
                    <option value="Ciencias Naturales">Ciencias Naturales</option>
                    <option value="Ciencias Sociales">Ciencias Sociales</option>
                    <option value="Derecho y Dignidad de la Mujer">Derecho y Dignidad de la Mujer</option>
                    <option value="Aprender Emprender y Prosperar">Aprender Emprender y Prosperar</option>
                    <option value="Taller de Arte y Cultura">Taller de Arte y Cultura</option>
                    <option value="Creciendo en Valores">Creciendo en Valores</option>
                    <option value="Educación Física">Educación Física</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label>Nombre y número de Unidad:</label>
            <input type="text" id="unidad" value="Unidad III: Ciudadanía, Historia y Desarrollo Comunitario">
        </div>

        <div class="input-group">
            <label>Tema o Contenido Específico:</label>
            <input type="text" id="contenido" placeholder="Ej. El Cuento Nicaragüense, Cálculo de Áreas, Ecosistemas...">
        </div>

        <div class="input-group">
            <label>Indicador de Logro:</label>
            <textarea id="indicador">Aplica con precisión los conceptos y procedimientos estudiados en situaciones prácticas del entorno escolar y comunitario.</textarea>
        </div>

        <div class="grid-2">
            <div class="input-group">
                <label>Fecha:</label>
                <input type="date" id="fecha">
            </div>
            <div class="input-group">
                <label>Instrumento de Evaluación:</label>
                <select id="instrumento">
                    <option value="Lista de cotejo">Lista de cotejo</option>
                    <option value="Rúbrica">Rúbrica</option>
                    <option value="Escala de valoración">Escala de valoración</option>
                </select>
            </div>
        </div>

        <button onclick="generarPlanDiario()">🚀 Generar Plan de Clase Completo</button>
    </div>

    <!-- RESULTADO -->
    <div class="card" id="result-card" style="display: none;">
        <h3 style="color: var(--primary); border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-top:0;">📄 Plan Diario Oficial</h3>
        <div id="plan-container" class="plan-output"></div>

        <div class="action-btns">
            <button class="btn-secondary" onclick="copiarTexto()">📋 Copiar al Portapapeles</button>
            <button onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
        </div>
    </div>
</div>

<script>
    document.getElementById('fecha').valueAsDate = new Date();

    function generarPlanDiario() {
        const grado = document.getElementById('grado').value;
        const asignatura = document.getElementById('asignatura').value;
        const unidad = document.getElementById('unidad').value;
        const contenido = document.getElementById('contenido').value || "Tema central de la clase";
        const indicador = document.getElementById('indicador').value;
        const fecha = document.getElementById('fecha').value;
        const instrumento = document.getElementById('instrumento').value;

        let contenidoEspecificoHtml = "";

        // Generación rica según la asignatura seleccionada para evitar planes pobres
        if (asignatura === "Lengua y Literatura") {
            contenidoEspecificoHtml = `
                <p><strong>Lectura Modelo / Texto Base:</strong></p>
                <blockquote style="background: #fdf4ff; border-left: 4px solid #a855f7; padding: 12px 15px; margin: 10px 0; font-style: italic;">
                    «La Leyenda y la Tradición de Nuestra Tierra»<br>
                    En las comunidades de nuestra hermosa Nicaragua, las historias de antaño se transmiten de generación en generación. Los ancianos relatan con orgullo los sucesos que dan identidad a nuestros pueblos, enseñando valores de respeto, unión y amor por las raíces culturales. Analizar estos textos nos permite valorar la riqueza de nuestro lenguaje y mejorar nuestra expresión oral y escrita.
                </blockquote>
                <p><strong>Guía de Comprensión Lectora (Basada en el texto anterior):</strong></p>
                <ul>
                    <li><strong>Nivel Literal:</strong> ¿Qué propósito tienen las historias de antaño según el texto y dónde se transmiten?</li>
                    <li><strong>Nivel Inferencial:</strong> ¿Por qué es importante mantener viva la tradición oral en las comunidades nicaragüenses?</li>
                    <li><strong>Nivel Crítico:</strong> ¿De qué manera puedes compartir las leyendas o tradiciones de tu propia comunidad con tus compañeros?</li>
                </ul>
            `;
        } else if (asignatura === "Matemáticas") {
            contenidoEspecificoHtml = `
                <div style="border: 2px solid #1e293b; padding: 15px; border-radius: 8px; background: #f8fafc; margin-top: 10px;">
                    <p style="margin-top:0; font-weight:bold; color:var(--primary);">📝 PLAN DE PIZARRA MATEMÁTICO</p>
                    <p><strong>(P) Problema / Situación:</strong> Resolver el caso práctico aplicando el concepto de (${contenido}).</p>
                    <p><strong>(S) Solución paso a paso:</strong> Identificación de datos, selección de la operación correcta y ejecución del algoritmo matemático.</p>
                    <p><strong>(C) Conclusión:</strong> Regla matemática o propiedad aplicada para resolver ejercicios similares.</p>
                    <p><strong>(Ej) Ejemplo guiado:</strong> Resolución en la pizarra con participación activa de los estudiantes.</p>
                    <p><strong>(E) Ejercicios propuestos:</strong> Práctica en el cuaderno de actividades del estudiante.</p>
                </div>
            `;
        } else {
            contenidoEspecificoHtml = `
                <p><strong>Desarrollo Teórico y Conceptual (${asignatura}):</strong></p>
                <p>Abordaje integral del contenido <strong>${contenido}</strong> mediante exposición dialogada, análisis de láminas o esquemas visuales, relacionando la teoría directamente con el entorno cotidiano de los estudiantes en Nicaragua.</p>
                <p><strong>Preguntas de Análisis y Reflexión:</strong></p>
                <ul>
                    <li>¿Qué elementos principales definen el tema estudiado?</li>
                    <li>¿Cómo impacta este conocimiento en nuestra vida diaria y comunitaria?</li>
                </ul>
            `;
        }

        const htmlFinal = `
            <h4 style="text-align:center; color: #1e3a8a; margin-bottom: 5px;">MINISTERIO DE EDUCACIÓN - PLAN DIARIO DE CLASE</h4>
            <hr style="border: 0; border-top: 1px solid #cbd5e1; margin-bottom: 15px;">
            <p><strong>Plan Diario Asignatura:</strong> ${asignatura} &nbsp;&nbsp;|&nbsp;&nbsp; <strong>Fecha:</strong> ${fecha} &nbsp;&nbsp;|&nbsp;&nbsp; <strong>Grado:</strong> ${grado}</p>
            <p><strong>Tiempo:</strong> 45 minutos (Inicio: 10 min | Desarrollo: 25 min | Culminación: 10 min)</p>
            <p><strong>Nombre y número de Unidad:</strong> ${unidad}</p>
            <p><strong>Contenido:</strong> ${contenido}</p>
            <p><strong>Indicador de logro:</strong> ${indicador}</p>
            
            <p><strong>Criterios de evaluación:</strong></p>
            <ul>
                <li><strong>*Conceptual:</strong> Comprende con claridad los conceptos, reglas y datos clave de (${contenido}).</li>
                <li><strong>*Procedimental:</strong> Aplica correctamente los pasos, técnicas o fórmulas correspondientes en los ejercicios y dinámicas.</li>
                <li><strong>*Actitudinal:</strong> Muestra respeto, colaboración, orden y entusiasmo durante el trabajo en clase.</li>
            </ul>

            <p><strong>Actividades de inicio:</strong></p>
            <ul>
                <li>Saludo afectuoso de bienvenida y control de asistencia.</li>
                <li>Oración de agradecimiento y entonación del Himno Nacional.</li>
                <li>Dinámica breve de activación mental o retroalimentación del tema anterior.</li>
            </ul>

            <p><strong>Actividades de desarrollo:</strong></p>
            <ul>
                <li>Presentación motivacional del contenido: <strong>${contenido}</strong> vinculándolo con nuestra realidad.</li>
                <li>Explicación magistral y ejemplificación guiada por parte del docente.</li>
                <li>${contenidoEspecificoHtml}</li>
                <li>Trabajo colaborativo en parejas o equipos para afianzar el aprendizaje.</li>
            </ul>

            <p><strong>Actividades de Culminación:</strong></p>
            <ul>
                <li>Plenaria general con participación de los estudiantes para compartir conclusiones.</li>
                <li>Aplicación del instrumento de evaluación formativa: <strong>${instrumento}</strong>.</li>
                <li>Síntesis final de la jornada por parte del profesor.</li>
            </ul>

            <p><strong>Tarea:</strong> Resolver ejercicios complementarios en el hogar relacionados con (${contenido}).</p>
            
            <p><strong>Adecuación curricular para niños con dificultades:</strong> Brindar acompañamiento personalizado, utilizar apoyo visual esquemático, simplificar la consigna de trabajo y dar flexibilidad de tiempo según el ritmo del estudiante.</p>
        `;

        document.getElementById('plan-container').innerHTML = htmlFinal;
        document.getElementById('result-card').style.display = 'block';
    }

    function copiarTexto() {
        const texto = document.getElementById('plan-container').innerText;
        navigator.clipboard.writeText(texto).then(() => {
            alert("¡Plan copiado al portapapeles con éxito!");
        });
    }
</script>

</body>
</html>
