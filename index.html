<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nica Planes 2026 - Generador Oficial</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #0d9488;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        #login-screen {
            background: var(--card);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            margin: 100px auto;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        select, input, textarea, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            padding: 12px;
            font-size: 15px;
        }

        button:hover {
            background-color: #1e40af;
        }

        #main-app {
            display: none;
        }

        .card {
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .plan-output {
            background: white;
            padding: 25px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-top: 20px;
        }

        .pizarra-box {
            border: 2px solid #334155;
            padding: 15px;
            border-radius: 8px;
            background-color: #f8fafc;
            margin-top: 15px;
        }

        .pizarra-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            border-bottom: 2px solid #334155;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-copy { background-color: var(--secondary); }
        .btn-copy:hover { background-color: #0f766e; }

        @media print {
            body { padding: 0; background: white; }
            #login-screen, .card-controls, .action-btns, header { display: none !important; }
            #main-app { display: block !important; }
            .card { box-shadow: none; padding: 0; }
            .plan-output { border: none; padding: 0; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- PANTALLA DE ACCESO (CANDADO CON 100 CÓDIGOS) -->
    <div id="login-screen">
        <h2>🔒 Nica Planes 2026</h2>
        <p>Ingrese su código de acceso autorizado:</p>
        <div class="input-group">
            <input type="text" id="access-key" placeholder="Ej. NX-7492-K">
        </div>
        <button onclick="checkAccess()">Ingresar al Sistema</button>
        <p id="error-msg" style="color: red; display: none; margin-top: 10px;">Código incorrecto o no autorizado.</p>
    </div>

    <!-- PANEL PRINCIPAL -->
    <div id="main-app">
        <header style="margin-bottom: 20px; text-align: center;">
            <h2>🇳🇮 Nica Planes 2026 - Generador Oficial</h2>
            <p>Mallas Curriculares y Formatos Oficiales Actualizados</p>
        </header>

        <div class="card card-controls">
            <div class="grid-2">
                <div class="input-group">
                    <label>Grado:</label>
                    <select id="select-grado" onchange="cargarAsignaturas()">
                        <option value="">-- Seleccione el Grado --</option>
                        <option value="3">3.º Grado</option>
                        <option value="4">4.º Grado</option>
                        <option value="5">5.º Grado</option>
                        <option value="6">6.º Grado</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Asignatura:</label>
                    <select id="select-asignatura" onchange="cargarContenidosPredefinidos()">
                        <option value="">-- Seleccione Asignatura --</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label>Autocompletar desde Malla (Opcional):</label>
                <select id="select-autocompletar" onchange="aplicarAutocompletado()">
                    <option value="">-- Seleccione para autocompletar o escriba abajo --</option>
                </select>
            </div>

            <div class="input-group">
                <label>Nombre y número de Unidad:</label>
                <input type="text" id="input-unidad" placeholder="Ej. Unidad II: Cuentos e historias">
            </div>

            <div class="input-group">
                <label>Contenido:</label>
                <input type="text" id="input-contenido" placeholder="Ej. El Cuento: Estructura e ideas principales">
            </div>

            <div class="input-group">
                <label>Indicador de Logro:</label>
                <textarea id="input-indicador" placeholder="Escriba o seleccione el indicador de logro..."></textarea>
            </div>

            <div class="grid-2">
                <div class="input-group">
                    <label>Fecha:</label>
                    <input type="date" id="plan-fecha">
                </div>
                <div class="input-group">
                    <label>Tiempo Total:</label>
                    <input type="text" id="plan-tiempo" value="45 minutos">
                </div>
            </div>

            <div class="grid-2">
                <div class="input-group">
                    <label>Instrumento de Evaluación:</label>
                    <select id="select-instrumento">
                        <option value="Lista de cotejo">Lista de cotejo</option>
                        <option value="Rúbrica">Rúbrica</option>
                        <option value="Escala de valoración">Escala de valoración</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Tiempo por Momentos (Inicio / Desarrollo / Culminación):</label>
                    <input type="text" id="plan-tiempos-momentos" value="10 min / 25 min / 10 min">
                </div>
            </div>

            <button onclick="generarPlan()">Generar Plan Diario</button>
        </div>

        <!-- VISTA PREVIA -->
        <div class="card" id="result-card" style="display: none;">
            <h3>Vista Previa del Plan Diario</h3>
            <div id="plan-container" class="plan-output"></div>

            <div class="action-btns">
                <button class="btn-copy" onclick="copiarPlan()">📋 Copiar Plan</button>
                <button onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
            </div>
        </div>
    </div>

</div>

<script>

    // VERIFICAR ACCESO CON LOS CÓDIGOS (CORREGIDO)

        const key = document.getElementById("access-key").value.trim();

            ]
        }
    };

    function cargarAsignaturas() {
        const grado = document.getElementById("select-grado").value;
        const selectAsig = document.getElementById("select-asignatura");
        const selectAuto = document.getElementById("select-autocompletar");
        
        selectAsig.innerHTML = '<option value="">-- Seleccione Asignatura --</option>';
        selectAuto.innerHTML = '<option value="">-- Seleccione para autocompletar o escriba abajo --</option>';

        if (grado && mallas[grado]) {
            Object.keys(mallas[grado]).forEach(asig => {
                const opt = document.createElement("option");
                opt.value = asig;
                opt.textContent = asig;
                selectAsig.appendChild(opt);
            });
        }
    }

    function cargarContenidosPredefinidos() {
        const grado = document.getElementById("select-grado").value;
        const asig = document.getElementById("select-asignatura").value;
        const selectAuto = document.getElementById("select-autocompletar");

        selectAuto.innerHTML = '<option value="">-- Seleccione para autocompletar o escriba abajo --</option>';

        if (grado && asig && mallas[grado][asig]) {
            mallas[grado][asig].forEach((item, index) => {
                const opt = document.createElement("option");
                opt.value = index;
                opt.textContent = `${item.unidad} - ${item.contenido}`;
                selectAuto.appendChild(opt);
            });
        }
    }

    function aplicarAutocompletado() {
        const grado = document.getElementById("select-grado").value;
        const asig = document.getElementById("select-asignatura").value;
        const idx = document.getElementById("select-autocompletar").value;

        if (idx !== "" && grado && asig) {
            const data = mallas[grado][asig][idx];
            document.getElementById("input-unidad").value = data.unidad || "";
            document.getElementById("input-contenido").value = data.contenido || "";
            document.getElementById("input-indicador").value = data.indicador || "";
        }
    }

    function generarPlan() {
        const grado = document.getElementById("select-grado").value;
        const asig = document.getElementById("select-asignatura").value;
        const unidad = document.getElementById("input-unidad").value;
        const contenido = document.getElementById("input-contenido").value;
        const indicador = document.getElementById("input-indicador").value;
        const fecha = document.getElementById("plan-fecha").value || "Por definir";
        const tiempo = document.getElementById("plan-tiempo").value;
        const instrumento = document.getElementById("select-instrumento").value;
        const tiemposMomentos = document.getElementById("plan-tiempos-momentos").value;

        if (!grado || !asig) {
            alert("Por favor seleccione Grado y Asignatura.");
            return;
        }

        const container = document.getElementById("plan-container");
        let html = "";

        // FORMATO DE MATEMÁTICA (PLAN DE PIZARRA)
        if (asig === "Matemática") {
            let p = "Resolver la situación problemática planteada.", s = "Aplicación del algoritmo correspondiente.", c = "Conclusión matemática de la clase.", ej = "Ejemplo guiado.", e = "Ejercicios propuestos en el texto.", tarea = "Página asignada.";
            if(mallas[grado]["Matemática"]) {
                const match = mallas[grado]["Matemática"].find(m => m.contenido === contenido);
                if(match) { p = match.p; s = match.s; c = match.c; ej = match.ej; e = match.e; tarea = match.tarea; }
            }

            html = `
                <h3 style="text-align:center; margin-top:0;">Formato para la elaboración del plan de clase de matemática</h3>
                <p><strong>Asignatura:</strong> Matemática &nbsp;&nbsp;&nbsp; <strong>Grado:</strong> ${grado}.º &nbsp;&nbsp;&nbsp; <strong>Fecha:</strong> ${fecha} &nbsp;&nbsp;&nbsp; <strong>Tiempo:</strong> ${tiempo} (${tiemposMomentos})</p>
                <p><strong>Nombre y número de Unidad:</strong> ${unidad || "Unidad de Matemática"}</p>
                <p><strong>Indicador de Logro:</strong> ${indicador || "Indicador matemático"}</p>
                <p><strong>Contenido:</strong> ${contenido || "Contenido matemático"}</p>
                <p><strong>I. Criterios de Evaluación:</strong></p>
                <ul>
                    <li>• Comprende con claridad la situación problemática planteada.</li>
                    <li>• Aplica correctamente el procedimiento matemático en la solución.</li>
                    <li>• Muestra interés, orden y perseverancia en la resolución.</li>
                </ul>
                <p><strong>Instrumento de evaluación:</strong> ${instrumento}</p>

                <!-- CUADRO PLAN DE PIZARRA -->
                <div class="pizarra-box">
                    <div class="pizarra-header">
                        <span>${unidad}</span>
                        <span>${fecha}</span>
                    </div>
                    <p><strong>SXCX: ${contenido}</strong></p>
                    <p><strong>(P) Problema:</strong> ${p}</p>
                    <p><strong>(S) Solución:</strong><br>${s.replace(/\n/g, '<br>')}</p>
                    <p><strong>(C) Conclusión:</strong> ${c}</p>
                    <p><strong>(Ej) Ejemplo:</strong> ${ej}</p>
                    <p><strong>(E) Ejercicios:</strong> ${e}</p>
                    <p style="text-align:right;"><strong>Tarea:</strong> ${tarea}</p>
                </div>

                <p style="margin-top:15px;"><strong>Adecuación curricular para niños con dificultades de lectoescritura:</strong> Uso de material concreto, apoyo visual adicional, lectura guiada de los enunciados de los problemas y desglose de operaciones en pasos cortos.</p>
                <p style="margin-top:10px;"><strong>Observaciones:</strong> __________________________________________________</p>
            `;
        } 
        // FORMATO DETALLADO DE LENGUA Y LITERATURA / OTRAS MATERIAS
        else {
            html = `
                <h3 style="text-align:center; margin-top:0;">Plan Diario Asignatura</h3>
                <p><strong>Plan Diario Asignatura:</strong> ${asig}</p>
                <p><strong>Fecha:</strong> ${fecha} &nbsp;&nbsp;&nbsp; <strong>Tiempo:</strong> ${tiempo} (${tiemposMomentos}) &nbsp;&nbsp;&nbsp; <strong>Grado:</strong> ${grado}.º</p>
                <p><strong>Nombre y número de Unidad:</strong> ${unidad || "Unidad correspondiente"}</p>
                <p><strong>Indicador de logro:</strong> ${indicador || "Indicador correspondiente"}</p>
                <p><strong>Contenido:</strong> ${contenido || "Contenido correspondiente"}</p>

                <p><strong>I. Criterios de Evaluación:</strong></p>
                <ul>
                    <li>• *Conceptual: Identifica y comprende la estructura y conceptos clave de (${contenido}).</li>
                    <li>• *Procedimental: Aplica estrategias de análisis, lectura y producción de textos de forma coherente.</li>

                <p><strong>Instrumento de evaluación:</strong> ${instrumento}</p>

                <p><strong>II. Actividades de Inicio:</strong></p>
                <ul>
                    <li>• Saludo de bienvenida: Intercambio afectuoso y cordial con los estudiantes.</li>
                    <li>• Oración a Dios: Agradecimiento y encomienda del día en un ambiente de respeto.</li>
                    <li>• Entonar el Himno Nacional: Fomento de los valores patrios e identidad nacional.</li>
                    <li>• Dinámica para recordar tema anterior: Preguntas exploratorias y retroalimentación breve.</li>
                    <li>• Revisión de tarea y asistencia: Verificación del cumplimiento de responsabilidades en casa.</li>
                    <li>• Dar a conocer el tema e indicador: Explicación clara de lo que se aprenderá hoy (${contenido}).</li>
                </ul>

                <p><strong>III. Actividades de Desarrollo:</strong></p>
                <ul>
                    <li>• Presentación de lámina: Exhibición de recurso visual relacionado con (${contenido}).</li>
                    <li>• Discriminación de imagen: Análisis guiado sobre los elementos observados en la lámina.</li>
                    <li>• Dinámica de opinión (Lluvia de ideas, etc.): Intervención abierta para conocer las impresiones del grupo.</li>
                    <li>• Lectura Modelo (Docente): Demostración de entonación, pausas y modulación de voz por parte del profesor.</li>
                    <li>&nbsp;&nbsp;&nbsp;&nbsp;- Lectura Silenciosa y Coral: Práctica individual y conjunta del texto de estudio.</li>
                    <li>&nbsp;&nbsp;&nbsp;&nbsp;- Comentarios Orales: Plenaria sobre las ideas principales captadas en la lectura.</li>
                    <li>&nbsp;&nbsp;&nbsp;&nbsp;- Escritura: Registro de apuntes esenciales en los cuadernos de trabajo.</li>
                    <li>&nbsp;&nbsp;&nbsp;&nbsp;- Trabajo en Parejas o grupos (Comprensión Lectora): En pares o grupos, los alumnos resuelven la siguiente guía en sus cuadernos:</li>
                    <li>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;• Nivel Literal: ¿Qué información explícita se destaca en el texto estudiado?</li>
                    <li>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;• Nivel Inferencial: ¿Qué deducciones o relaciones lógicas podemos extraer del contenido?</li>
                    <li>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;• Nivel Crítico: ¿Cuál es su opinión fundamentada acerca de la temática abordada?</li>
                    <li>• Explicación del Docente: Consolidación teórica y aclaración de conceptos complejos sobre (${contenido}).</li>
                </ul>

                <p><strong>IV. Actividades de Culminación y Evaluación:</strong></p>
                <ul>
                    <li>• Culminación: Síntesis global de la jornada y conclusiones generales en plenaria.</li>
                    <li>• Evaluación: Aplicación de la herramienta de evaluación (${instrumento}) para verificar el logro del indicador.</li>
                    <li>• Tarea: Asignación de ejercicio complementario para afianzar el contenido en casa.</li>
                </ul>

                <p><strong>Adecuación curricular para niños con dificultades de lectoescritura:</strong> Asignación de un tutor par de apoyo, facilitación de textos con tipografía ampliada o fragmentos más cortos, uso de esquemas gráficos y flexibilidad en los tiempos de ejecución de lectura y escritura.</p>
            `;
        }

        container.innerHTML = html;
        document.getElementById("result-card").style.display = "block";
    }

    function copiarPlan() {
        const text = document.getElementById("plan-container").innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert("¡Plan copiado al portapapeles con éxito!");
        });
    }
</script>
