<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nica Planes 2026 - Generador Oficial</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #0d9488;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        #login-screen {
            background: var(--card);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            margin: 100px auto;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        select, input, textarea, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            padding: 12px;
            font-size: 15px;
        }

        button:hover {
            background-color: #1e40af;
        }

        #main-app {
            display: none;
        }

        .card {
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .plan-output {
            background: white;
            padding: 25px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-top: 20px;
        }

        .pizarra-box {
            border: 2px solid #334155;
            padding: 15px;
            border-radius: 8px;
            background-color: #f8fafc;
            margin-top: 15px;
        }

        .pizarra-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            border-bottom: 2px solid #334155;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-copy { background-color: var(--secondary); }
        .btn-copy:hover { background-color: #0f766e; }

        @media print {
            body { padding: 0; background: white; }
            #login-screen, .card-controls, .action-btns, header { display: none !important; }
            #main-app { display: block !important; }
            .card { box-shadow: none; padding: 0; }
            .plan-output { border: none; padding: 0; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- PANTALLA DE ACCESO -->
    <div id="login-screen">
        <h2>🔒 Nica Planes 2026</h2>
        <p>Ingrese su clave de acceso docente:</p>
        <div class="input-group">
            <input type="password" id="access-key" placeholder="Contraseña...">
        </div>
        <button onclick="checkAccess()">Ingresar al Sistema</button>
        <p id="error-msg" style="color: red; display: none; margin-top: 10px;">Clave incorrecta. Intente de nuevo.</p>
    </div>

    <!-- PANEL PRINCIPAL -->
    <div id="main-app">
        <header style="margin-bottom: 20px; text-align: center;">
            <h2>🇳🇮 Nica Planes 2026 - Generador Oficial</h2>
            <p>Mallas Curriculares y Formatos Oficiales Actualizados</p>
        </header>

        <div class="card card-controls">
            <div class="grid-2">
                <div class="input-group">
                    <label>Grado:</label>
                    <select id="select-grado" onchange="cargarAsignaturas()">
                        <option value="">-- Seleccione el Grado --</option>
                        <option value="3">3.º Grado (II Unidad)</option>
                        <option value="4">4.º Grado (II Unidad)</option>
                        <option value="5">5.º Grado (III Unidad)</option>
                        <option value="6">6.º Grado (III Unidad)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Asignatura:</label>
                    <select id="select-asignatura" onchange="cargarContenidosPredefinidos()">
                        <option value="">-- Seleccione Asignatura --</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label>Autocompletar desde Malla (Opcional):</label>
                <select id="select-autocompletar" onchange="aplicarAutocompletado()">
                    <option value="">-- Seleccione para autocompletar o escriba abajo --</option>
                </select>
            </div>

            <div class="input-group">
                <label>Nombre y número de Unidad:</label>
                <input type="text" id="input-unidad" placeholder="Ej. Unidad II: Cuentos e historias">
            </div>

            <div class="input-group">
                <label>Contenido:</label>
                <input type="text" id="input-contenido" placeholder="Ej. El Cuento: Estructura e ideas principales">
            </div>

            <div class="input-group">
                <label>Indicador de Logro:</label>
                <textarea id="input-indicador" placeholder="Escriba o seleccione el indicador de logro..."></textarea>
            </div>

            <div class="grid-2">
                <div class="input-group">
                    <label>Fecha:</label>
                    <input type="date" id="plan-fecha">
                </div>
                <div class="input-group">
                    <label>Tiempo Total:</label>
                    <input type="text" id="plan-tiempo" value="45 minutos">
                </div>
            </div>

            <div class="grid-2">
                <div class="input-group">
                    <label>Instrumento de Evaluación:</label>
                    <select id="select-instrumento">
                        <option value="Lista de cotejo">Lista de cotejo</option>
                        <option value="Rúbrica">Rúbrica</option>
                        <option value="Escala de valoración">Escala de valoración</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Tiempo por Momentos (Inicio / Desarrollo / Culminación):</label>
                    <input type="text" id="plan-tiempos-momentos" value="10 min / 25 min / 10 min">
                </div>
            </div>

            <button onclick="generarPlan()">Generar Plan Diario</button>
        </div>

        <!-- VISTA PREVIA -->
        <div class="card" id="result-card" style="display: none;">
            <h3>Vista Previa del Plan Diario</h3>
            <div id="plan-container" class="plan-output"></div>

            <div class="action-btns">
                <button class="btn-copy" onclick="copiarPlan()">📋 Copiar Plan</button>
                <button onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
            </div>
        </div>
    </div>

</div>

<script>
    // BASE DE DATOS DE MALLAS CURRICULARES
    const mallas = {
        "3": {
            "Lengua y Literatura": [
                { unidad: "Unidad II: Cuentos E historias", indicador: "Aplica estrategias de comprensión lectora en la lectura de cuentos locales.", contenido: "El Cuento: Estructura e ideas principales." },
                { unidad: "Unidad II: Cuentos E historias", indicador: "Redacta oraciones simples respetando las reglas ortográficas del uso de la mayúscula y el punto.", contenido: "La oración simple y ortografía." }
            ],
            "Matemática": [
                { unidad: "Unidad II: Geometría y Medición", indicador: "Calcula el perímetro de figuras geométricas regulares aplicándolo a la vida cotidiana.", contenido: "Cálculo de Perímetro", p: "Hallar el perímetro de una parcela rectangular de 4m de largo y 2m de ancho.", s: "4m + 2m + 4m + 2m = 12m", c: "El perímetro es la suma de los lados de una figura.", ej: "Calcular el perímetro de un cuadrado de 3cm de lado.", e: "Pág. 45 ejercicios 1 y 2.", tarea: "Página 46" }
            ],
            "Ciencias Naturales": [
                { unidad: "Unidad II: El Cuerpo Humano", indicador: "Identifica las principales funciones de los órganos vitales del cuerpo humano.", contenido: "Los Órganos Vitales" }
            ],
            "Estudios Sociales": [
                { unidad: "Unidad II: Nuestra Comunidad", indicador: "Reconoce los principales hitos históricos y geográficos del municipio.", contenido: "Geografía y Mapa Local" }
            ]
        },
        "4": {
            "Lengua y Literatura": [
                { unidad: "Unidad II: Textos Informativos", indicador: "Infiere la idea central en noticias y textos informativos breves.", contenido: "La Noticia: Estructura y análisis." }
            ],
            "Matemática": [
                { unidad: "Unidad II: Fracciones", indicador: "Reconoce fracciones homogéneas y las representa gráficamente.", contenido: "Fracciones Homogéneas", p: "Representar 2/4 y 3/4 en una figura.", s: "Se divide la figura en 4 partes iguales y se pintan las indicadas.", c: "Las fracciones homogéneas tienen el mismo denominador.", ej: "Representar 1/3 y 2/3.", e: "Pág. 60 ejercicios A y B.", tarea: "Página 61" }
            ],
            "Ciencias Naturales": [
                { unidad: "Unidad II: Los Eecosistemas", indicador: "Describe la flora y fauna característica de los ecosistemas locales.", contenido: "Eecosistemas de Nicaragua" }
            ],
            "Estudios Sociales": [
                { unidad: "Unidad II: Regiones de Nicaragua", indicador: "Ubica geográficamente las regiones del país y sus características.", contenido: "Regiones del Pacífico y Central" }
            ]
        },
        "5": {
            "Lengua y Literatura": [
                { unidad: "Unidad III: La Narrativa y sus Elementos", indicador: "Analiza los elementos narrativos (personajes, ambiente, tiempo) en mitos y leyendas nicaragüenses.", contenido: "La Leyenda Nicaragüense." }
            ],
            "Matemática": [
                { unidad: "Unidad III: Decimales y Porcentajes", indicador: "Resuelve problemas de suma y resta con números decimales en contextos cotidianos.", contenido: "Suma de Decimales", p: "María compra 2.5 lb de arroz y 1.25 lb de azúcar. ¿Cuánto pesa la compra?", s: "  2.50\n+ 1.25\n------\n  3.75 lb", c: "Para sumar decimales se alinea la coma o punto decimal.", ej: "Sumar 4.2 + 3.15", e: "Pág. 82 ejercicios 1a y 1b.", tarea: "Página 83" }
            ],
            "Ciencias Naturales": [
                { unidad: "Unidad III: La Materia y Energía", indicador: "Explica los estados físicos de la materia y sus transformaciones.", contenido: "Estados de la Materia" }
            ],
            "Estudios Sociales": [
                { unidad: "Unidad III: Historia Nacional", indicador: "Examina los procesos históricos clave en la formación de la nación.", contenido: "Historia de Nicaragua" }
            ]
        },
        "6": {
            "Lengua y Literatura": [
                { unidad: "Unidad III: Textos Expositivos y Argumentativos", indicador: "Redacta textos expositivos respetando la estructura de introducción, desarrollo y conclusión.", contenido: "El Ensayo Breve." }
            ],
            "Matemática": [
                { unidad: "Unidad III: Áreas de Figuras Planas", indicador: "Calcula el área del triángulo y paralelogramo aplicando las fórmulas correspondientes.", contenido: "Área del Triángulo", p: "Calcular el área de un triángulo de base 6cm y altura 4cm.", s: "Área = (Base x Altura) / 2 = (6 x 4) / 2 = 12 cm²", c: "El área del triángulo es la mitad de la base por la altura.", ej: "Calcular el área si base=8cm y altura=5cm.", e: "Pág. 94 ejercicios 1 y 2.", tarea: "Página 95" }
            ],
            "Ciencias Naturales": [
                { unidad: "Unidad III: El Universo y la Tierra", indicador: "Comprende los movimientos de la Tierra y las capas atmosféricas.", contenido: "Movimientos de la Tierra" }
            ],
            "Estudios Sociales": [
                { unidad: "Unidad III: Cívica y Ciudadanía", indicador: "Analiza los derechos y deberes ciudadanos establecidos en la Constitución.", contenido: "Derechos Ciudadanos" }
            ]
        }
    };

    function checkAccess() {
        const key = document.getElementById("access-key").value;
        if (key === "nica2026") {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("main-app").style.display = "block";
        } else {
            document.getElementById("error-msg").style.display = "block";
        }
    }

    function cargarAsignaturas() {
        const grado = document.getElementById("select-grado").value;
        const selectAsig = document.getElementById("select-asignatura");
        const selectAuto = document.getElementById("select-autocompletar");
        
        selectAsig.innerHTML = '<option value="">-- Seleccione Asignatura --</option>';
        selectAuto.innerHTML = '<option value="">-- Seleccione para autocompletar o escriba abajo --</option>';

        if (grado && mallas[grado]) {
            Object.keys(mallas[grado]).forEach(asig => {
                const opt = document.createElement("option");
                opt.value = asig;
                opt.textContent = asig;
                selectAsig.appendChild(opt);
            });
        }
    }

    function cargarContenidosPredefinidos() {
        const grado = document.getElementById("select-grado").value;
        const asig = document.getElementById("select-asignatura").value;
        const selectAuto = document.getElementById("select-autocompletar");

        selectAuto.innerHTML = '<option value="">-- Seleccione para autocompletar o escriba abajo --</option>';

        if (grado && asig && mallas[grado][asig]) {
            mallas[grado][asig].forEach((item, index) => {
                const opt = document.createElement("option");
                opt.value = index;
                opt.textContent = `${item.unidad} - ${item.contenido}`;
                selectAuto.appendChild(opt);
            });
        }
    }

    function aplicarAutocompletado() {
        const grado = document.getElementById("select-grado").value;
        const asig = document.getElementById("select-asignatura").value;
        const idx = document.getElementById("select-autocompletar").value;

        if (idx !== "" && grado && asig) {
            const data = mallas[grado][asig][idx];
            document.getElementById("input-unidad").value = data.unidad || "";
            document.getElementById("input-contenido").value = data.contenido || "";
            document.getElementById("input-indicador").value = data.indicador || "";
        }
    }

    function generarPlan() {
        const grado = document.getElementById("select-grado").value;
        const asig = document.getElementById("select-asignatura").value;
        const unidad = document.getElementById("input-unidad").value;
        const contenido = document.getElementById("input-contenido").value;
        const indicador = document.getElementById("input-indicador").value;
        const fecha = document.getElementById("plan-fecha").value || "Por definir";
        const tiempo = document.getElementById("plan-tiempo").value;
        const instrumento = document.getElementById("select-instrumento").value;
        const tiemposMomentos = document.getElementById("plan-tiempos-momentos").value;

        if (!grado || !asig) {
            alert("Por favor seleccione Grado y Asignatura.");
            return;
        }

        const container = document.getElementById("plan-container");
        let html = "";

        // FORMATO DE MATEMÁTICA (PLAN DE PIZARRA)
        if (asig === "Matemática") {
            // Buscamos datos matemáticos precargados si existen, o usamos genéricos
            let p = "Resolver la situación problemática planteada.", s = "Aplicación del algoritmo correspondiente.", c = "Conclusión matemática de la clase.", ej = "Ejemplo guiado.", e = "Ejercicios propuestos en el texto.", tarea = "Página asignada.";
            if(mallas[grado]["Matemática"]) {
                const match = mallas[grado]["Matemática"].find(m => m.contenido === contenido);
                if(match) { p = match.p; s = match.s; c = match.c; ej = match.ej; e = match.e; tarea = match.tarea; }
            }

            html = `
                <h3 style="text-align:center; margin-top:0;">Formato para la elaboración del plan de clase de matemática</h3>
                <p><strong>Asignatura:</strong> Matemática &nbsp;&nbsp;&nbsp; <strong>Grado:</strong> ${grado}.º &nbsp;&nbsp;&nbsp; <strong>Fecha:</strong> ${fecha} &nbsp;&nbsp;&nbsp; <strong>Tiempo:</strong> ${tiempo}</p>
                <p><strong>Nombre y número de Unidad:</strong> ${unidad || "Unidad de Matemática"}</p>
                <p><strong>Indicador de Logro:</strong> ${indicador || "Indicador matemático"}</p>
                <p><strong>Contenido:</strong> ${contenido || "Contenido matemático"}</p>
                <p><strong>I. Criterios de Evaluación:</strong></p>
                <ul>
                    <li>• Comprende con claridad la situación problemática planteada.</li>
                    <li>• Aplica correctamente el procedimiento matemático en la solución.</li>
                    <li>• Muestra interés, orden y perseverancia en la resolución.</li>
                </ul>
                <p><strong>Instrumento de evaluación:</strong> ${instrumento}</p>

                <!-- CUADRO PLAN DE PIZARRA -->
                <div class="pizarra-box">
                    <div class="pizarra-header">
                        <span>${unidad}</span>
                        <span>${fecha}</span>
                    </div>
                    <p><strong>SXCX: ${contenido}</strong></p>
                    <p><strong>(P) Problema:</strong> ${p}</p>
                    <p><strong>(S) Solución:</strong><br>${s.replace(/\n/g, '<br>')}</p>
                    <p><strong>(C) Conclusión:</strong> ${c}</p>
                    <p><strong>(Ej) Ejemplo:</strong> ${ej}</p>
                    <p><strong>(E) Ejercicios:</strong> ${e}</p>
                    <p style="text-align:right;"><strong>Tarea:</strong> ${tarea}</p>
                </div>

                <p style="margin-top:15px;"><strong>Adecuación curricular para niños con dificultades de lectoescritura:</strong> Uso de material concreto, apoyo visual adicional, lectura guiada de los enunciados de los problemas y desglose de operaciones en pasos cortos.</p>
                <p style="margin-top:10px;"><strong>Observaciones:</strong> __________________________________________________</p>
            `;
        } 
        // FORMATO DETALLADO DE LENGUA Y LITERATURA / OTRAS MATERIAS
        else {
            html = `
                <h3 style="tex
